[package]
name = "sm2lc"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
postgrest = "1.6.0"
reqwest = { version = "0.11", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["rt", "macros", "rt-multi-thread"] }
